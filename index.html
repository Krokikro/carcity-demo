<title>Деньги Кар Сити</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300&family=Onest:wght@400;600&display=swap">
<style>
:root { color-scheme: dark; --bg: #0B0B0C; --surface: #16181B; --control: #1F1F23; --text: #ECECEA; --muted: #8A9094; --signal: #FFB700; --bad: #FF6B5E; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 15px/1.47 'Onest', system-ui, sans-serif; padding: 24px 16px; }
form { background: var(--surface); border-radius: 24px; padding: 28px 24px; width: min(100%, 380px); display: grid; gap: 14px; }
h1 { font: 300 26px/1.1 'Unbounded', system-ui, sans-serif; margin: 0; letter-spacing: -.02em; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input, button { font: inherit; border-radius: 999px; border: 1px solid transparent; padding: 10px 16px; min-height: 44px; }
input { background: var(--control); color: var(--text); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
button { background: var(--signal); color: #0B0B0C; font-weight: 600; cursor: pointer; }
.err { color: var(--bad); min-height: 20px; }
</style>
</head>
